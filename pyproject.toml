[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "toolcall-ft"
version = "0.1.0"
description = "Can a small open model call MCP tools as reliably as a large one? Fine-tuning, judged by cMCP's own validator."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Simon-oid" }]
dependencies = []

[project.optional-dependencies]
# Training and local generation (torch is installed separately, for your GPU).
train = ["transformers>=4.46", "peft>=0.13", "trl>=0.12", "datasets>=3.0", "accelerate>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
