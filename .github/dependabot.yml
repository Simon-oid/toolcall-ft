# Weekly update PRs, grouped into one per ecosystem to keep the noise down.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups:
      python: {patterns: ["*"]}
